# fly.toml app configuration file generated for bankend-tlgm-2p on 2026-03-26T01:49:06Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'bankend-tlgm-2p'
primary_region = 'iad'
kill_signal = 'SIGTERM'
kill_timeout = 30

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [http_service.concurrency]
    type = 'requests'
    soft_limit = 20
    hard_limit = 25

  [[http_service.checks]]
    grace_period = '15s'
    interval = '30s'
    method = 'GET'
    timeout = '5s'
    path = '/health'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
