app = 'bankend-tlgm-2p'
primary_region = 'iad'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']
  idle_timeout = '300s' # Se apaga tras 5 min de inactividad para ahorrar

  [[http_service.checks]]
    grace_period = "15s"   # Tiempo que Fly.io espera antes de verificar (era 10s)
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
